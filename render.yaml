services:
  - type: web
    name: millelo
    runtime: python
    rootDir: MillELOcom/MillELOcom
    buildCommand: python -m pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --worker-class gevent --log-level info main:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false

{% extends "base.html" %}

{% block title %}Verify Login - MillELO.com{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 20px; color: #f0d060;">
            <i class="fas fa-shield-alt"></i> Email Verification
        </h2>
        
        <p style="text-align: center; color: #888; margin-bottom: 25px;">
            Enter the 6-digit code sent to your email to complete login.
        </p>
        
        <form method="POST">
            <div class="form-group">
                <label for="code">Verification Code:</label>
                <input type="text" id="code" name="code" required 
                       maxlength="6" pattern="[0-9]{6}" 
                       placeholder="Enter 6-digit code"
                       style="text-align: center; font-size: 24px; letter-spacing: 8px; font-weight: bold;">
            </div>
            
            <button type="submit" class="btn" style="width: 100%; margin-top: 20px;">
                <i class="fas fa-check"></i> Verify
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 20px;">
            <p style="color: #888; font-size: 14px;">
                <i class="fas fa-info-circle"></i> Code expires in 10 minutes
            </p>
            <a href="{{ url_for('login') }}" style="color: #3893e8;">Back to Login</a>
        </div>
    </div>
</div>

<style>
    #code {
        background: rgba(0, 0, 0, 0.3);
        border: 2px solid rgba(56, 147, 232, 0.3);
        color: #5dade2;
    }
    #code:focus {
        border-color: #3498db;
        box-shadow: 0 0 10px rgba(52, 152, 219, 0.3);
    }
</style>
{% endblock %}
